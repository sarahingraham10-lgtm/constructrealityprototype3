<!doctype html>
<html lang="en">
<head>

<title>ConstructReality Studio</title>
<style>
  html,body{margin:0;height:100%;background:#fff;color:#000;font-family:Helvetica,Arial,sans-serif;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #boot{position:fixed;inset:0;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:5;transition:opacity .5s}

  #boot p{margin:0;font-size:15px;letter-spacing:.04em;color:#bbb}
  #vrslot{position:fixed;left:0;right:0;bottom:22px;display:flex;justify-content:center;z-index:3;pointer-events:none}
  #vrslot button{pointer-events:auto}
  #VRButton{position:static!important;transform:none!important;background:#000!important;color:#fff!important;border:2px solid #fff!important;border-radius:2px!important;font:700 16px Helvetica,Arial,sans-serif!important;padding:14px 26px!important;letter-spacing:.04em;opacity:1!important}
  #hint{position:fixed;right:16px;top:14px;font-size:12px;color:#444;max-width:240px;text-align:right;z-index:2}
</style>
<script type="importmap">{"imports":{"three":"/vendor/three.module.js","three/addons/":"/vendor/addons/"}}</script>

<canvas id="c"></canvas>
<div id="boot"><img src="/logo_white.png" alt="ConstructReality"><p>Loading your design studio</p></div>
<div id="vrslot"></div>
